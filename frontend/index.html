<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <meta
      name="description"
      content="A simple expense tracker for managing personal spending."
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="card app-card">
        <header class="topbar">
          <div>
            <p class="eyebrow">Monthly overview</p>
            <h1>Expense Tracker</h1>
          </div>
          <div class="total-box" aria-live="polite">
            <span class="label">Total spent</span>
            <strong id="totalAmount">€0.00</strong>
          </div>
        </header>

        <section class="panel form-panel" aria-labelledby="add-expense-title">
          <div class="panel-header">
            <h2 id="add-expense-title">Add Expense</h2>
          </div>

          <form id="expenseForm" novalidate>
            <div class="field-group">
              <label for="title">Expense title</label>
              <input
                id="title"
                name="title"
                type="text"
                placeholder="e.g. Groceries"
                maxlength="100"
                required
              />
            </div>

            <div class="field-row">
              <div class="field-group">
                <label for="amount">Amount</label>
                <input
                  id="amount"
                  name="amount"
                  type="number"
                  min="0.01"
                  step="0.01"
                  placeholder="0.00"
                  required
                />
              </div>

              <div class="field-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                  <option value="">Select</option>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Housing">Housing</option>
                  <option value="Utilities">Utilities</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Shopping">Shopping</option>
                  <option value="Health">Health</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" id="submitButton">Add Expense</button>
            </div>
            <p id="formMessage" class="form-message" aria-live="polite"></p>
          </form>
        </section>

        <section class="panel list-panel" aria-labelledby="expenses-title">
          <div class="panel-header panel-header-split">
            <h2 id="expenses-title">Expenses</h2>
            <span id="expenseCount" class="count-badge">0 items</span>
          </div>

          <div id="loadingState" class="state-message hidden">Loading expenses...</div>
          <div id="emptyState" class="empty-state hidden">
            <p>No expenses yet.</p>
            <span>Add your first expense to get started.</span>
          </div>
          <ul id="expenseList" class="expense-list" aria-live="polite"></ul>
        </section>
      </section>
    </main>

    <script src="./js/config.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
